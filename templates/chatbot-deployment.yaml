{{- if .Values.chatbot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "integration-manager.chatbot.fullname" . }}
  labels:
    app: integration-manager
    component: chatbot
    chart: {{ template "integration-manager.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.chatbot.replicaCount }}
  revisionHistoryLimit: {{ .Values.chatbot.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: integration-manager
      component: chatbot
      release: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/sharedconfig: {{ include (print $.Template.BasePath "/shared-configmap.yaml") . | sha256sum }}
        checksum/chatbotconfig: {{ include (print $.Template.BasePath "/chatbot-configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- if .Values.chatbot.podAnnotations }}
        {{ .Values.chatbot.podAnnotations | toYaml | indent 8 | trim }}
        {{- end }}
      labels:
        app: integration-manager
        component: chatbot
        chart: {{ template "integration-manager.chart" . }}
        release: {{ .Release.Name }}
        {{- if .Values.chatbot.extraLabels }}
        {{ .Values.chatbot.extraLabels | toYaml | indent 8 | trim }}
        {{- end }}
    spec:
      {{- if .Values.chatbot.affinity }}
      affinity:
        {{ .Values.chatbot.affinity | toYaml | indent 8 | trim }}
      {{- end }}
      serviceAccountName: {{ template "integration-manager.fullname" . }}
      {{- if .Values.chatbot.nodeSelector }}
      nodeSelector:
        {{ .Values.chatbot.nodeSelector | toYaml | indent 8 | trim }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.chatbot.podSecurityContext | nindent 8 }}
      containers:
      - name: integration-manager-chatbot
        image: {{ .Values.chatbot.image }}
        imagePullPolicy: {{ .Values.chatbot.pullPolicy }}
        securityContext:
          {{- toYaml .Values.chatbot.securityContext | nindent 10 }}
        env:
        {{- if .Values.integrationManagerBase.javaOpts }}
        - name: JAVA_OPTS
          value: {{ .Values.integrationManagerBase.javaOpts }}
        {{- end }}
        {{- with .Values.extraEnvVars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.chatbot.extraEnvVars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: im-shared-volume
          readOnly: true
          mountPath: /etc/config/shared.properties
          subPath: application.properties
        - name: im-chatbot-volume
          readOnly: true
          mountPath: /etc/config/application.properties
          subPath: application.properties
        - name: secret-volume
          readOnly: true
          mountPath: /etc/secrets
        {{- if .Values.existingRabbitSecret }}
        - name: amqp-secret-volume
          readOnly: true
          mountPath: /etc/secrets/amqp
        {{- end }}
        - name: license-vol
          readOnly: true
          mountPath: /opt/Actian/licenses
        readinessProbe:
          {{ .Values.chatbot.readinessProbe | toYaml | indent 10 | trim }}
        livenessProbe:
          {{ .Values.chatbot.livenessProbe | toYaml | indent 10 | trim }}
        {{- if .Values.chatbot.resources }}
        resources:
          {{ .Values.chatbot.resources | toYaml | indent 10 | trim }}
        {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      volumes:
      - name: im-shared-volume
        configMap:
          name: {{ template "integration-manager.fullname" . }}-shared
      - name: im-chatbot-volume
        configMap:
          name: {{ template "integration-manager.chatbot.fullname" . }}
      - name: secret-volume
        secret:
          {{- if .Values.existingSecret }}
          secretName: {{ .Values.existingSecret }}
          {{- else }}
          secretName: {{ template "integration-manager.fullname" . }}
          {{- end }}
      {{- if .Values.existingRabbitSecret }}
      - name: amqp-secret-volume
        secret:
          secretName: {{ .Values.existingRabbitSecret }}
          items:
          - key: rabbitmq-username
            path: rabbitmq-username
          - key: rabbitmq-password
            path: rabbitmq-password
      {{- end }}
      - name: license-vol
        configMap:
          name: {{ template "integration-manager.base.fullname" . }}-dest-licenses
{{- end }}
