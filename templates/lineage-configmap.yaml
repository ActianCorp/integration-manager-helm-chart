{{- if .Values.lineage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "integration-manager.lineage.fullname" . }}
  labels:
    app: integration-manager
    chart: {{ template "integration-manager.chart" . }}
    release: {{ .Release.Name }}
data:
  application.properties: |
    # Lineage service deployment overrides — these take precedence over shared-configmap values
    lineage.enabled=true
    spring.liquibase.enabled=false
    lineage.namespace={{ .Values.lineage.namespace | default "im-jobs" }}

    {{- if .Values.lineage.extraConfig }}
    {{ .Values.lineage.extraConfig | indent 4 | trim }}
    {{- end }}
{{- end }}
