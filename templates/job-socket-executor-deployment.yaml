{{- if .Values.jobSocketExecutor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "integration-manager.job-socket-executor.fullname" . }}
  labels:
    app: integration-manager
    component: job-socket-executor
    chart: {{ template "integration-manager.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.jobSocketExecutor.replicaCount }}
  revisionHistoryLimit: {{ .Values.jobSocketExecutor.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: integration-manager
      component: job-socket-executor
      release: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/sharedconfig: {{ include (print $.Template.BasePath "/shared-configmap.yaml") . | sha256sum }}
        checksum/jobSocketExecutorconfig: {{ include (print $.Template.BasePath "/job-socket-executor-configmap.yaml") . | sha256sum }}
        {{- if .Values.jobSocketExecutor.podAnnotations }}
        {{ .Values.jobSocketExecutor.podAnnotations | toYaml | indent 8 | trim }}
        {{- end }}
      labels:
        app: integration-manager
        component: job-socket-executor
        chart: {{ template "integration-manager.chart" . }}
        release: {{ .Release.Name }}
        {{- if .Values.jobSocketExecutor.extraLabels }}
        {{ .Values.jobSocketExecutor.extraLabels | toYaml | indent 8 | trim }}
        {{- end }}
    spec:
      {{- if .Values.jobSocketExecutor.affinity }}
      affinity:
        {{ .Values.jobSocketExecutor.affinity | toYaml | indent 8 | trim }}
      {{- end }}
      serviceAccountName: {{ template "integration-manager.fullname" . }}
      {{- if .Values.jobSocketExecutor.nodeSelector }}
      nodeSelector:
        {{ .Values.jobSocketExecutor.nodeSelector | toYaml | indent 8 | trim  }}
      {{- end }}
      {{- if .Values.jobSocketExecutor.extraInitContainers }}
      initContainers:
        {{ tpl .Values.jobSocketExecutor.extraInitContainers . | indent 8 | trim }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.jobSocketExecutor.podSecurityContext | nindent 8 }}
      containers:
        - name: job-socket-executor
          image: {{ .Values.jobSocketExecutor.image }}
          imagePullPolicy: {{ .Values.jobSocketExecutor.pullPolicy }}
          {{- if .Values.jobSocketExecutor.securityContext }}
          securityContext:
            {{- toYaml .Values.jobSocketExecutor.securityContext | nindent 12 }}
          {{- end }}
          env:
        {{- with .Values.extraEnvVars }}
        {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.jobSocketExecutor.extraEnvVars }}
        {{- toYaml . | nindent 10 }}
        {{- end }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: im-shared-volume
              readOnly: true
              mountPath: /etc/config/shared.properties
              subPath: application.properties
            - name: job-socket-executor-volume
              readOnly: true
              mountPath: /etc/config/application.properties
              subPath: application.properties
          {{- if .Values.jobSocketExecutor.readinessProbe }}
          readinessProbe:
            {{ .Values.jobSocketExecutor.readinessProbe | toYaml | indent 12 | trim }}
          {{- end }}
          {{- if .Values.jobSocketExecutor.livenessProbe }}
          livenessProbe:
            {{ .Values.jobSocketExecutor.livenessProbe | toYaml | indent 12 | trim }}
          {{- end }}
          {{- if .Values.jobSocketExecutor.resources }}
          resources:
            {{ .Values.jobSocketExecutor.resources | toYaml | indent 12 | trim }}
          {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      volumes:
        - name: im-shared-volume
          configMap:
            name: {{ template "integration-manager.fullname" . }}-shared
        - name: job-socket-executor-volume
          configMap:
            name: {{ template "integration-manager.job-socket-executor.fullname" . }}
{{- end }}
